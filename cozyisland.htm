<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Island Proto - Three.js + Cannon-es</title>
<style>
body { margin: 0; overflow: hidden; background-color: #a3e2f7; }
#instructions {
position: absolute; top: 10px; left: 10px;
color: #2c3e50; font-family: sans-serif; font-weight: bold;
background: rgba(255,255,255,0.7); padding: 10px; border-radius: 8px;
pointer-events: none;
}
</style>
</head>
<body>
<div id="instructions">Use WASD or Arrow Keys to move the Cozy Character!</div>

<!-- Import Three.js and Cannon-es via ES Modules -->
<script type="module">
import * as THREE from 'https://unpkg.com';
import * as CANNON from 'https://unpkg.com';

// --- 1. SETUP VARIABLES ---
let scene, camera, renderer, world;
let playerMesh, playerBody;
let groundMesh, groundBody;
const keys = { w: false, a: false, s: false, d: false };
const moveSpeed = 8;

initThree();
initCannon();
createWorld();
setupInput();
animate();

// --- 2. INITIALIZE THREE.JS (GRAPHICS) ---
function initThree() {
scene = new THREE.Scene();
scene.background = new THREE.Color(0xa3e2f7); // Soft sky blue

camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 10, 12); // Isometric-style overhead view
camera.lookAt(0, 0, 0);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Bright, toy-like lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

window.addEventListener('resize', onWindowResize);
}

// --- 3. INITIALIZE CANNON-ES (PHYSICS) ---
function initCannon() {
world = new CANNON.World();
world.gravity.set(0, -9.82, 0); // Real world gravity
}

// --- 4. CREATE GAME OBJECTS ---
function createWorld() {
// --- GROUND ---
// Visuals: Low-poly styled flat shading green ground
const groundGeo = new THREE.BoxGeometry(30, 1, 30);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x76c893, roughness: 0.6, flatShading: true });
groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Physics: Flat box matching the visual ground
const groundShape = new CANNON.Box(new CANNON.Vec3(15, 0.5, 15));
groundBody = new CANNON.Body({ mass: 0, shape: groundShape }); // mass 0 makes it static
groundBody.position.set(0, -0.5, 0);
world.addBody(groundBody);

// --- PLAYER CHARACTER ---
// Visuals: Bright pink clay-like spherical character
const playerGeo = new THREE.SphereGeometry(1, 16, 16);
const playerMat = new THREE.MeshStandardMaterial({ color: 0xff70a6, roughness: 0.4, flatShading: true });
playerMesh = new THREE.Mesh(playerGeo, playerMat);
playerMesh.castShadow = true;
scene.add(playerMesh);

// Physics: A sphere body so it rolls and reacts smoothly
const playerShape = new CANNON.Sphere(1);
playerBody = new CANNON.Body({
mass: 1, // Has weight, can move
shape: playerShape,
linearDamping: 0.1, // Friction to slow down gliding
angularDamping: 0.1
});
playerBody.position.set(0, 5, 0); // Spawn in mid-air to watch it drop
world.addBody(playerBody);
}

// --- 5. HANDLE USER CONTROLS ---
function setupInput() {
const handleKey = (e, isDown) => {
const key = e.key.toLowerCase();
if (key === 'w' || key === 'arrowup') keys.w = isDown;
if (key === 'a' || key === 'arrowleft') keys.a = isDown;
if (key === 's' || key === 'arrowdown') keys.s = isDown;
if (key === 'd' || key === 'arrowright') keys.d = isDown;
};

window.addEventListener('keydown', (e) => handleKey(e, true));
window.addEventListener('keyup', (e) => handleKey(e, false));
}

function updateMovement() {
// Reset horizontal velocity before applying new force
playerBody.velocity.x = 0;
playerBody.velocity.z = 0;

// Apply direct velocity based on key inputs
if (keys.w) playerBody.velocity.z = -moveSpeed;
if (keys.s) playerBody.velocity.z = moveSpeed;
if (keys.a) playerBody.velocity.x = -moveSpeed;
if (keys.d) playerBody.velocity.x = moveSpeed;
}

// --- 6. GAME LOOP & ANIMATION ---
function animate() {
requestAnimationFrame(animate);

// Step the physics engine forward (60 frames per second standard)
world.fixedStep();

// Update player controls
updateMovement();

// Sync visual Mesh position with the Physics Body position
playerMesh.position.copy(playerBody.position);

// OPTIONAL: Add a "derpy/wobbly" scale animation when moving to mimic the original game style
const isMoving = keys.w || keys.s || keys.a || keys.d;
if (isMoving) {
const time = Date.now() * 0.01;
playerMesh.scale.y = 1 + Math.sin(time) * 0.15; // stretch up and down
playerMesh.scale.x = 1 - Math.sin(time) * 0.1; // squish sides
playerMesh.scale.z = 1 - Math.sin(time) * 0.1;
} else {
// Smoothly return to normal shape when idle
playerMesh.scale.set(1, 1, 1);
playerMesh.quaternion.copy(playerBody.quaternion); // Sync regular rotation
}

// Make the camera follow the player smoothly
camera.position.x = playerMesh.position.x;
camera.position.z = playerMesh.position.z + 12;

renderer.render(scene, camera);
}

function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>
