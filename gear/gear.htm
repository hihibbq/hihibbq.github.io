<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D gear</title>
    <style>
    body {margin: 0;overflow: hidden;background-color: #000;}
    canvas {display: block;width: 100vw;height: 100vh;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5); // Position camera up and back
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const gears = [];
        gears[0] = createGear(0, 0, 0);
        gears[1] = createGear(1.2, 0, 0);
        gears[2] = createGear(0.5, 0.8, 90);

        const rings = [];
        rings[0] = createRing(1.5, 0, 0);
        rings[1] = createRing(-0.4, 0, 0);

        const cage = createCage(1.5, 0, 0);
        const pivot =  new THREE.Group();
        pivot.position.set(0, 0, 0);
        scene.add(pivot);
        pivot.add(cage.rectangle);
        pivot.add(cage.rectangle2);
        pivot.add(cage.rectangle3);
        pivot.add(gears[2].cylinder);
        pivot.add(gears[2].rectangle);
        pivot.add(gears[2].rectangle2);
        pivot.add(gears[2].rectangle3);


        function createCage(pos, pos2, rot) {
            const material = new THREE.MeshNormalMaterial();
            const rectgeom = new THREE.BoxGeometry(0.8, 0.5, 0.2);
            const rectangle = new THREE.Mesh(rectgeom, material);
            scene.add(rectangle);
            const rectgeom2 = new THREE.BoxGeometry(0.8, 0.5, 0.2);
            const rectangle2 = new THREE.Mesh(rectgeom2, material);
            scene.add(rectangle2);
            const rectgeom3 = new THREE.BoxGeometry(0.2, 0.5, 2.1);
            const rectangle3 = new THREE.Mesh(rectgeom3, material);
            scene.add(rectangle3);
            rectangle.position.z = 1.5;
            rectangle.position.x = 0.6;
            rectangle2.position.z = -0.4;
            rectangle2.position.x = 0.6;
            rectangle3.position.z = 0.55;
            rectangle3.position.x = 1.1;
            rectgeom3.center(); //rotates around true middle
            return ({ rectangle,rectangle2,rectangle3});
        }

        function createRing(pos, pos2, rot) {
            const tubeShape = new THREE.Shape();
            const holePath = new THREE.Path();
            tubeShape.absarc(0, 0, 0.4, 0, Math.PI * 2, false);
            holePath.absarc(0, 0, 0.2, 0, Math.PI * 2, true);
            const extrudeSettings = {depth:0.2,  bevelEnabled:false, curveSegments:32};
            tubeShape.holes.push(holePath);
            const ringgeom = new THREE.ExtrudeGeometry(tubeShape, extrudeSettings);
            const ringmaterial = new THREE.MeshNormalMaterial();
            const ring = new THREE.Mesh(ringgeom, ringmaterial);
            ringgeom.center(); //rotates around true middle
            scene.add(ring);
            ring.position.z = pos;
        }

        function createGear(pos, pos2, rot) {
            const material = new THREE.MeshNormalMaterial();
            const geometry = new THREE.CylinderGeometry(0.5, 0.5, 0.2, 32);
            const cylinder = new THREE.Mesh(geometry, material);
            scene.add(cylinder);
            geometry.rotateX(Math.PI/180 * 90);
            const rectgeom = new THREE.BoxGeometry(1.4, 0.2, 0.2);
            const rectangle = new THREE.Mesh(rectgeom, material);
            scene.add(rectangle);
            const rectgeom2 = new THREE.BoxGeometry(1.4, 0.2, 0.2);
            const rectangle2 = new THREE.Mesh(rectgeom2, material);
            scene.add(rectangle2);
            rectgeom2.rotateZ(Math.PI/180 * 120);
            const rectgeom3 = new THREE.BoxGeometry(1.4, 0.2, 0.2);
            const rectangle3 = new THREE.Mesh(rectgeom3, material);
            scene.add(rectangle3);
            rectgeom3.rotateZ(Math.PI/180 * 60);
            cylinder.position.z = pos;
            rectangle.position.z = pos;
            rectangle2.position.z = pos;
            rectangle3.position.z = pos;
            cylinder.position.x = pos2;
            rectangle.position.x = pos2;
            rectangle2.position.x = pos2;
            rectangle3.position.x = pos2;
            geometry.rotateY(Math.PI/180 * rot);
            rectgeom.rotateY(Math.PI/180 * rot);
            rectgeom2.rotateY(Math.PI/180 * rot);
            rectgeom3.rotateY(Math.PI/180 * rot);
            return ({cylinder, rectangle,rectangle2,rectangle3});
        }


        window.addEventListener('resize', () => {//Handle Window Resizing
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            var gear = gears[0];
            gear.cylinder.rotation.z += 0.01;
            gear.rectangle.rotation.z += 0.01;
            gear.rectangle2.rotation.z += 0.01;
            gear.rectangle3.rotation.z += 0.01;
            gear = gears[1];
            gear.cylinder.rotation.z -= 0.01;
            gear.rectangle.rotation.z -= 0.01;
            gear.rectangle2.rotation.z -= 0.01;
            gear.rectangle3.rotation.z -= 0.01;
            gear = gears[2];
            gear.cylinder.rotation.x += 0.01;
            gear.rectangle.rotation.x += 0.01;
            gear.rectangle2.rotation.x += 0.01;
            gear.rectangle3.rotation.x += 0.01;
            pivot.rotation.z -= 0.01;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
