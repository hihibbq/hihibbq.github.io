<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Browser Game Boy Color Emulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        #file-selector-container {
            margin-bottom: 25px;
            text-align: center;
        }

        /* Styled file input button */
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
            display: inline-block;
        }

        .upload-btn:hover {
            background-color: #45a049;
        }

        #rom-file {
            display: none;
        }

        /* Container hosting the EmulatorJS window */
        #emulator-wrapper {
            width: 640px;
            height: 480px;
            max-width: 90vw;
            max-height: 70vh;
            background-color: #000000;
            border: 4px solid #333333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* Hidden until a ROM is chosen */
        }

        #game-area {
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 20px;
            font-size: 14px;
            color: #aaaaaa;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Game Boy Color Web Emulator</h1>

    <!-- Step 1: Select Rom File -->
    <div id="file-selector-container">
        <label for="rom-file" class="upload-btn">Load GBC Game ROM</label>
        <input type="file" id="rom-file" accept=".gb,.gbc">
    </div>

    <!-- Step 2: Emulator Container Window -->
    <div id="emulator-wrapper">
        <div id="game-area"></div>
    </div>

    <div class="instructions">
        <p>Select a legal <strong>.gbc</strong> or <strong>.gb</strong> file to start. The emulator features full game window scaling, audio output, saved state management, and configuration menus directly accessible via its lower UI overlay.</p>
    </div>

    <script>
        // Setup configuration environment for EmulatorJS before loading the framework engine
        window.EJS_player = '#game-area';
        window.EJS_core = 'gbc'; // Targets the Game Boy Color emulator core
        
        // Use CDN distribution paths hosting the required WebAssembly core bundles
        window.EJS_pathtodata = 'https://emulatorjs.org'; 

        const fileInput = document.getElementById('rom-file');
        const emuWrapper = document.getElementById('emulator-wrapper');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(event) {
                // Convert file content into a Uint8Array buffer
                window.EJS_gameUrl = new Uint8Array(event.target.result);
                
                // Hide the loader button and expose the player view container
                document.getElementById('file-selector-container').style.display = 'none';
                emuWrapper.style.display = 'block';

                // Dynamically inject the stable loader script to launch the compilation environment
                const script = document.createElement('script');
                script.src = 'https://emulatorjs.orgloader.js';
                document.body.appendChild(script);
            };

            reader.readAsArrayBuffer(file);
        });
    </script>

</body>
</html>
