<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>JSBoy 模擬器基礎架構示範</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; }
        #screen { background: #8bac0f; border: 4px solid #333; } /* GameBoy 經典綠色螢幕 */
    </style>
</head>
<body>

    <h1>JSBoy 模擬器讀取示範</h1>
    <!-- GameBoy 標準解析度為 160x144 像素 -->
    <canvas id="screen" width="160" height="144"></canvas>
    <br><br>
    <input type="file" id="rom-loader" accept=".gb,.gbc">
    <p id="status">請選擇 GameBoy 遊戲 ROM 檔案 (.gb)</p>

    <script>
        // 1. 初始化虛擬 CPU 與記憶體 (MMU)
        class GameBoyCPU {
            constructor() {
                this.pc = 0x0100; // GameBoy 程式計數器通常從 0x0100 開始執行
                this.registers = { a: 0, b: 0, c: 0, d: 0, e: 0, h: 0, l: 0 }; // 8位元暫存器
                this.memory = new Uint8Array(0x10000); // 64KB 記憶體空間
            }

            loadROM(romBuffer) {
                // 將 ROM 檔案寫入記憶體中
                const romData = new Uint8Array(romBuffer);
                for (let i = 0; i < romData.length; i++) {
                    this.memory[i] = romData[i];
                }
                this.readCartridgeHeader();
            }

            readCartridgeHeader() {
                // 讀取卡帶標題 (GameBoy ROM 的 0x0134 - 0x0143 區間為遊戲名稱)
                let title = "";
                for (let i = 0x0134; i <= 0x0143; i++) {
                    if (this.memory[i] === 0) break;
                    title += String.fromCharCode(this.memory[i]);
                }
                document.getElementById('status').innerText = `成功載入遊戲: ${title}`;
            }

            // 模擬 CPU 執行一個指令週期 (Cycle)
            step() {
                let opcode = this.memory[this.pc];
                // 實際模擬器會在這裡透過 switch-case 解析數百個 opcode (例如: 0x3E 代表 LD A, d8)
                this.pc++; 
            }
        }

        // 2. 初始化畫布 (Canvas)
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');

        // 3. 實例化 JSBoy 核心
        const jsBoy = new GameBoyCPU();

        // 4. 監聽檔案上傳，讀取二進位 ROM 資料
        document.getElementById('rom-loader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                // 將檔案轉換為 ArrayBuffer 並餵給模擬器核心
                jsBoy.loadROM(event.target.result);
                
                // 模擬繪製一個簡單的 GameBoy 像素點（實作畫面渲染）
                ctx.fillStyle = '#0f380f'; // 最深綠色
                ctx.fillRect(10, 10, 8, 8); // 畫一個 8x8 的經典方塊
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
