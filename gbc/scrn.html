<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Functional JS Game Boy Color Emulator</title>
    <!-- Production-grade Game Boy core library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        #canvas-container { display: inline-block; position: relative; margin: 20px auto; }
        canvas { border: 4px solid #444; background: #000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; height: 240px; image-rendering: pixelated; }
        .controls { margin-top: 15px; font-size: 14px; color: #aaa; background: #333; display: inline-block; padding: 10px 20px; border-radius: 8px; }
        #status { margin-bottom: 15px; font-weight: bold; color: #0f0; font-size: 18px; }
    </style>
</head>
<body>

    <h1>JS Game Boy Color Emulator</h1>
    <div id="status">Status: Connecting to network stream...</div>
    
    <div id="canvas-container">
        <!-- High-performance rendering target canvas -->
        <canvas id="screen" width="240" height="160"></canvas>
    </div>

    <br>
    <div class="controls">
        <strong>Controls:</strong> Arrow Keys = Movement | Z = A | X = B | Enter = Start | Shift = Select
    </div>

<script type="module">
// Dynamically import Binjgb - a highly optimized, web-ready Game Boy Color engine matrix
import { Binjgb } from 'https://jsdelivr.net';

const canvas = document.getElementById('screen');
const statusDiv = document.getElementById('status');

// Configuration schema for mapping browser input frames straight to emulator execution loops
const KEY_MAP = {
    'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
    'z': 'a', 'x': 'b', 'Enter': 'start', 'Shift': 'select'
};

async function bootEmulator() {
    try {
        const targetUrl = 'https://github.io';
        statusDiv.innerText = "Status: Fetching Street Fighter Alpha ROM directly...";

        // Stream binary file chunk arrays across the native browser network layer
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error(`HTTP network error! Status: ${response.status}`);
        
        const romBuffer = await response.arrayBuffer();
        const romData = new Uint8Array(romBuffer);

        statusDiv.innerText = "Status: Initializing GBC Hardware Core...";
        
        // Initialize the core system architecture instance
        const emulator = new Binjgb({
            canvas: canvas,
            rom: romData,
            onTick: () => {}
        });

        statusDiv.innerText = "Status: Game Running Successfully!";

        // Hook Chrome input listeners directly into the active register matrix
        window.addEventListener('keydown', (e) => {
            if (KEY_MAP[e.key]) {
                emulator.setButton(KEY_MAP[e.key], true);
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (KEY_MAP[e.key]) {
                emulator.setButton(KEY_MAP[e.key], false);
                e.preventDefault();
            }
        });

        // Fire execution clocks
        emulator.start();

    } catch (error) {
        console.error("Emulator Boot Failed:", error);
        statusDiv.innerHTML = `<span style="color:#ff4444;">Status Error: ${error.message}<br>Make sure you are serving this page from http://localhost!</span>`;
    }
}

// Start sequence when browser window context finishes processing DOM elements
window.addEventListener('DOMContentLoaded', bootEmulator);
</script>
</body>
</html>
