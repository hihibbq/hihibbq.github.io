<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal GameBoy Color Emulator Structure</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #1a1a1a;
color: #fff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
}

.emulator-container {
background-color: #2d2d2d;
padding: 25px;
border-radius: 12px;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
text-align: center;
max-width: 500px;
}

.menu-row {
display: flex;
align-items: center;
justify-content: center;
gap: 12px;
margin-bottom: 15px;
}

select {
background-color: #444;
color: #fff;
padding: 10px;
border: 1px solid #555;
border-radius: 4px;
font-size: 14px;
cursor: pointer;
outline: none;
}

.divider {
color: #888;
font-size: 14px;
font-style: italic;
}

canvas {
background-color: #000;
border: 6px solid #444;
border-radius: 6px;
image-rendering: pixelated;
max-width: 100%;
box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}

#status-message {
margin-bottom: 15px;
font-size: 13px;
color: #00ffcc;
}

.controls {
margin-top: 15px;
font-size: 14px;
color: #aaa;
}

.upload-btn {
background-color: #4CAF50;
color: white;
padding: 10px 15px;
border-radius: 4px;
cursor: pointer;
font-size: 14px;
font-weight: bold;
}

.upload-btn:hover {
background-color: #45a049;
}

#rom-file {
display: none;
}

</style>
</head>
<body>

<div class="emulator-container">
<h2>jsGBC Web Player</h2>

<!-- Selection Dropdown and File Upload -->
<div class="menu-row">
<select id="rom-selector">
<option value="" disabled selected>-- Choose a Built-in Game --</option>
<!-- Public domain open-source GameBoy homebrew games -->
<option value="http://hihibbq.github.io/gbc/sfa.gbc">sfa.gbc</option>
<option value="http://hihibbq.github.io/gbc/sf2.gb">sf2.gb</option>
<option value="http://hihibbq.github.io/gbc/tetris.gbc">tetris.gbc</option>
</select>

<span class="divider">or</span>

<label for="rom-file" class="upload-btn">Upload Local File</label>
<input type="file" id="rom-file" accept=".gb,.gbc">
</div>

<div id="status-message">Select a game above to boot the core...</div>

<!-- GameBoy Screen Output -->
<canvas id="gbc-screen" width="160" height="144"></canvas>

<div class="controls">
<p><strong>Controls:</strong> Arrow Keys = D-Pad | Z = A | X = B | Enter = Start | Shift = Select</p>
</div>
</div>


<script>
(async () => {
// Pull jsGBC library module from the unpkg mirror network
const { GameBoy } = await import('https://unpkg.com');

const canvas = document.getElementById('gbc-screen');
const fileInput = document.getElementById('rom-file');
const romSelector = document.getElementById('rom-selector');
const statusMessage = document.getElementById('status-message');
let gameboy = null;

// Initialize and flash the binary buffer data into the virtual engine
function bootEmulator(romBuffer) {
if (gameboy) {
gameboy.stop();
}

try {
gameboy = new GameBoy({
lcd: { canvas: canvas }
});

gameboy.loadCartridge(new Uint8Array(romBuffer));
gameboy.start();

setupInputHandlers(gameboy);
statusMessage.textContent = "System running smoothly!";
statusMessage.style.color = "#00ffcc";
} catch (err) {
statusMessage.textContent = "Error executing ROM binary engine configuration.";
statusMessage.style.color = "#ff4444";
console.error(err);
}
}

// Event handler for Web URL dropdown selector
romSelector.addEventListener('change', async (e) => {
const url = e.target.value;
if (!url) return;

statusMessage.textContent = "Fetching game binary data over web stream...";
statusMessage.style.color = "#ffcc00";

try {
const response = await fetch(url);
if (!response.ok) throw new Error("Network request failure targeting asset.");

const arrayBuffer = await response.arrayBuffer();
bootEmulator(arrayBuffer);
} catch (error) {
statusMessage.textContent = "CORS block or structural connection problem fetching ROM.";
statusMessage.style.color = "#ff4444";
console.error(error);
}
});

// Event handler for local hard drive disk uploads
fileInput.addEventListener('change', async (event) => {
const file = event.target.files[0];
if (!file) return;

statusMessage.textContent = `Reading structure: ${file.name}`;
romSelector.value = ""; // Reset dropdown view option

const arrayBuffer = await file.arrayBuffer();
bootEmulator(arrayBuffer);
});

// Structural keydown / keyup hardware pipeline mappings
function setupInputHandlers(gbInstance) {
const keyMap = {
'ArrowUp': 'up',
'ArrowDown': 'down',
'ArrowLeft': 'left',
'ArrowRight': 'right',
'z': 'a',
'x': 'b',
'Enter': 'start',
'Shift': 'select'
};

window.addEventListener('keydown', (e) => {
if (keyMap[e.key]) {
e.preventDefault();
gbInstance.joypad.press(keyMap[e.key]);
}
});

window.addEventListener('keyup', (e) => {
if (keyMap[e.key]) {
e.preventDefault();
gbInstance.joypad.release(keyMap[e.key]);
}
});
}
})();

</script>

</body>
</html>
